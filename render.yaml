# Optional: lets Render create the service from this file ("New > Blueprint").
# You can also create the Web Service by hand in the Render dashboard (see README.md).
services:
  - type: web
    name: employee-management
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
