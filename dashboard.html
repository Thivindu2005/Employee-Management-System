<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System | Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="app-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="app-wrap">
    <!-- navbar -->
    <nav class="glass topbar">
      <strong>Employee Management</strong>
      <div class="d-flex align-items-center gap-3">
        <span id="userName" class="text-soft"></span>
        <button class="glass-btn ghost" onclick="logout()">Log out</button>
      </div>
    </nav>

    <!-- summary cards -->
    <section class="stats">
      <div class="glass stat"><span>Total employees</span><b id="statTotal">0</b></div>
      <div class="glass stat"><span>Departments</span><b id="statDept">0</b></div>
      <div class="glass stat"><span>Permanent staff</span><b id="statPerm">0</b></div>
      <div class="glass stat"><span>Monthly payroll</span><b id="statPay">0</b></div>
    </section>

    <!-- table -->
    <section class="glass panel">
      <div class="panel-head">
        <input id="search" class="glass-input" placeholder="Search by name or email">
        <select id="filterType" class="glass-input">
          <option value="">All types</option>
          <option>Permanent</option><option>Contract</option><option>Part-time</option>
        </select>
        <button class="glass-btn" id="addBtn">Add employee</button>
      </div>
      <div id="alert"></div>
      <div class="table-responsive">
        <table class="table glass-table align-middle">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Department</th><th>Type</th><th>Salary</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody id="empBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- add / edit modal -->
  <div class="modal fade" id="empModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content glass" id="empForm" novalidate>
        <div class="modal-header border-0">
          <h5 class="modal-title" id="modalTitle">Add employee</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body form-grid">
          <div><label>Full name *</label><input id="fFullName" class="glass-input" maxlength="150"></div>
          <div><label>Email *</label><input id="fEmail" type="email" class="glass-input"></div>
          <div><label>Phone (10 digits)</label><input id="fPhone" class="glass-input" maxlength="10"></div>
          <div><label>Gender</label>
            <select id="fGender" class="glass-input"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
          <div><label>Date of joining</label><input id="fJoin" type="date" class="glass-input"></div>
          <div><label>Employee type</label>
            <select id="fType" class="glass-input"><option>Permanent</option><option>Contract</option><option>Part-time</option></select></div>
          <div><label>Department</label><select id="fDept" class="glass-input"></select></div>
          <div><label>Designation</label><select id="fDesig" class="glass-input"></select></div>
          <div><label>Monthly salary</label><input id="fSalary" type="number" min="0" class="glass-input"></div>
        </div>
        <div id="formAlert" class="px-3"></div>
        <div class="modal-footer border-0">
          <button type="button" class="glass-btn ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="glass-btn" id="saveBtn">Save employee</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
