<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System | Departments</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="app-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="app-wrap">
    <nav class="glass topbar">
      <strong>Employee Management</strong>
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard.html" class="nav-link-glass">Employees</a>
        <button class="glass-btn ghost" onclick="logout()">Log out</button>
      </div>
    </nav>

    <div id="alert"></div>

    <div class="two-col">
      <!-- departments -->
      <section class="glass panel">
        <div class="panel-head">
          <h5 class="m-0 flex-grow-1">Departments</h5>
          <button class="glass-btn" id="addDept">Add department</button>
        </div>
        <ul class="item-list" id="deptList"></ul>
      </section>

      <!-- designations of the selected department -->
      <section class="glass panel">
        <div class="panel-head">
          <h5 class="m-0 flex-grow-1" id="desigTitle">Designations</h5>
          <button class="glass-btn" id="addDesig" disabled>Add designation</button>
        </div>
        <ul class="item-list" id="desigList"></ul>
      </section>
    </div>
  </div>

  <!-- one modal for adding and renaming -->
  <div class="modal fade" id="nameModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content glass" id="nameForm" novalidate>
        <div class="modal-header border-0">
          <h5 class="modal-title" id="nameTitle"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label for="nameInput">Name</label>
          <input id="nameInput" class="glass-input" maxlength="100" required>
          <div id="formAlert" class="mt-3"></div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="glass-btn ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="glass-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/departments.js"></script>
</body>
</html>
