<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System | Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">

  <!-- floating colour blobs behind the glass -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main class="login-wrap">
    <section class="glass login-card">
      <h1>Employee Management</h1>
      <p class="sub">Sign in to manage your team.</p>

      <div id="alert"></div>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" class="glass-input" placeholder="you@company.com" required>

        <label for="password">Password</label>
        <div class="pass-box">
          <input type="password" id="password" class="glass-input" placeholder="Your password" required>
          <button type="button" id="togglePass" class="toggle-btn">Show</button>
        </div>

        <button type="submit" id="loginBtn" class="glass-btn">
          <span class="spinner-border spinner-border-sm d-none" id="spin"></span>
          <span id="btnText">Sign in</span>
        </button>
      </form>

      <p class="hint" id="demoHint"></p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
